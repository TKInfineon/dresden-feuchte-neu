<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wettertest Dresden</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #f4f6f8;
            color: #202124;
            font-family: Arial, Helvetica, sans-serif;
        }

        .box {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
            background: white;
            border: 1px solid #dfe3e8;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        #status {
            padding: 14px;
            background: #e8f1fb;
            border-radius: 6px;
            font-weight: bold;
        }

        #status.success {
            color: #176b35;
            background: #e8f6ed;
        }

        #status.error {
            color: #a40000;
            background: #ffecec;
        }

        #details {
            margin-top: 16px;
            line-height: 1.6;
        }

        button {
            margin-top: 18px;
            padding: 10px 16px;
            color: white;
            background: #245ea8;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Test des Wetterabrufs</h1>

    <div id="status">
        JavaScript wird gestartet ...
    </div>

    <div id="details"></div>

    <button id="testButton" type="button">
        Erneut testen
    </button>
</div>

<script>
(function () {
    "use strict";

    var statusElement =
        document.getElementById("status");

    var detailsElement =
        document.getElementById("details");

    var testButton =
        document.getElementById("testButton");

    var apiUrl =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=51.1328" +
        "&longitude=13.7672" +
        "&hourly=temperature_2m,dew_point_2m,surface_pressure" +
        "&timezone=Europe%2FBerlin" +
        "&forecast_days=15";

    function showStatus(text, type) {
        statusElement.textContent = text;
        statusElement.className = type || "";
    }

    function testWeatherApi() {
        showStatus(
            "JavaScript funktioniert. Wetterdaten werden abgerufen ..."
        );

        detailsElement.textContent = "";
        testButton.disabled = true;

        var timeoutReached = false;

        var timeoutId =
            window.setTimeout(function () {
                timeoutReached = true;

                showStatus(
                    "Fehler: Die Wetter-API hat nach 15 Sekunden nicht geantwortet.",
                    "error"
                );

                testButton.disabled = false;
            }, 15000);

        fetch(apiUrl)
            .then(function (response) {
                if (!response.ok) {
                    throw new Error(
                        "HTTP-Fehler " + response.status
                    );
                }

                return response.json();
            })
            .then(function (data) {
                if (timeoutReached) {
                    return;
                }

                window.clearTimeout(timeoutId);

                if (
                    !data.hourly ||
                    !Array.isArray(data.hourly.time)
                ) {
                    throw new Error(
                        "Die API-Antwort enthält keine Stundenwerte."
                    );
                }

                var numberOfHours =
                    data.hourly.time.length;

                var firstTime =
                    data.hourly.time[0];

                var lastTime =
                    data.hourly.time[
                        numberOfHours - 1
                    ];

                showStatus(
                    "Erfolgreich: JavaScript und Wetterabruf funktionieren.",
                    "success"
                );

                detailsElement.innerHTML =
                    "<strong>Empfangene Stundenwerte:</strong> " +
                    numberOfHours +
                    "<br>" +
                    "<strong>Erster Zeitpunkt:</strong> " +
                    firstTime +
                    "<br>" +
                    "<strong>Letzter Zeitpunkt:</strong> " +
                    lastTime;

                testButton.disabled = false;
            })
            .catch(function (error) {
                if (timeoutReached) {
                    return;
                }

                window.clearTimeout(timeoutId);

                showStatus(
                    "Fehler beim Wetterabruf: " +
                    error.message,
                    "error"
                );

                testButton.disabled = false;
            });
    }

    testButton.addEventListener(
        "click",
        testWeatherApi
    );

    testWeatherApi();
})();
</script>

</body>
</html>
