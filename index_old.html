<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wetterplot Dresden-Klotzsche</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:20px;background:#f4f6f8;color:#202124;font-family:Arial,sans-serif}.dashboard{max-width:1400px;margin:auto;padding:24px;background:#fff;border:1px solid #dfe3e8;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.08)}h1{text-align:center;margin:0 0 8px}.subtitle,.status,.summary,.footer{text-align:center}.subtitle{color:#60656b}.status{min-height:24px;margin:16px 0;font-weight:bold}.loading{color:#245ea8}.success{color:#176b35}.error{color:#a40000;background:#ffecec;padding:12px;border-radius:6px}.controls,.quick,.legend{display:flex;justify-content:center;align-items:end;flex-wrap:wrap;gap:12px;margin:16px 0}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;font-weight:bold}input,button{padding:10px;border-radius:6px;font:inherit}input{border:1px solid #aeb4ba}button{border:0;background:#245ea8;color:#fff;font-weight:bold;cursor:pointer}button:disabled{opacity:.55}.save{background:#16823b}.quick button{padding:7px 12px;background:#fff;color:#245ea8;border:1px solid #9ab4d5}.summary{padding:12px;background:#f7f9fb;border:1px solid #e3e7eb;border-radius:8px;font-weight:bold}.legend{font-size:14px}.swatch{display:inline-block;width:28px;height:4px;margin-right:6px;vertical-align:middle}.temp{background:#8b0000}.hum{background:#16823b}.thr{height:0;border-top:3px dashed #e02020}.chart{height:650px}.chart canvas{display:block;width:100%;height:100%}.footer{margin-top:14px;color:#60656b;font-size:12px}@media(max-width:700px){body{padding:8px}.dashboard{padding:12px}.field,input,.controls button{width:100%}.chart{height:540px}}
  </style>
</head>
<body>
<main class="dashboard">
  <h1>Dresden-Klotzsche: Temperatur und absolute Feuchte</h1>
  <p id="subtitle" class="subtitle">Bitte Zeitraum auswählen</p>
  <div id="status" class="status loading">JavaScript wird gestartet ...</div>
  <div class="controls">
    <div class="field"><label for="start">Anfangszeitpunkt</label><input id="start" type="datetime-local" step="3600"></div>
    <div class="field"><label for="end">Endzeitpunkt</label><input id="end" type="datetime-local" step="3600"></div>
    <button id="load" type="button">Zeitraum laden</button>
    <button id="save" class="save" type="button" disabled>Diagramm als PNG</button>
  </div>
  <div class="quick">
    <button type="button" data-hours="24">Nächste 24 Stunden</button>
    <button type="button" data-hours="168">Nächste 7 Tage</button>
    <button type="button" data-hours="336">Nächste 14 Tage</button>
    <button type="button" data-hours="24" data-past="1">Letzte 24 Stunden</button>
    <button type="button" data-hours="168" data-past="1">Letzte 7 Tage</button>
  </div>
  <div id="summary" class="summary">Noch keine Daten geladen.</div>
  <div class="legend">
    <span><i class="swatch temp"></i>Temperatur [°C]</span>
    <span><i class="swatch hum"></i>Absolute Feuchte [g/kg]</span>
    <span><i class="swatch thr"></i>Entfeuchtungsgrenze</span>
  </div>
  <div class="chart"><canvas id="plot"></canvas></div>
  <div class="footer">Quelle: Open-Meteo · Referenzgrenze: 22 °C und 40 % relative Feuchte · Maximal 14 Tage</div>
</main>
<script src="./app.js"></script>
</body>
</html>
